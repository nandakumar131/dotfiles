set -g history-limit 100000

set -g default-terminal "screen-256color"

unbind %
bind '\' split-window -h

unbind '"'
bind '-' split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L

bind -r m resize-pane -Z

# sesh: fzf-driven session/project picker (prefix+s)
bind-key "s" run-shell "sesh connect \"$(sesh list -t | fzf-tmux -p 55%,60% --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ')\""

# global launcher (bin/launcher, prefix+g): picks a command by alias in a
# floating fzf-tmux popup, then types it and presses Enter in the pane
# that was focused when the key was pressed, so it works even when that
# pane isn't at a shell prompt (e.g. inside vim). The trailing `|| true`
# matters: cancelling (Esc) makes launcher print nothing, so
# `[ -n "$cmd" ]` is false and the whole command would exit 1 - which
# tmux's run-shell surfaces as a visible "returned 1" message.
bind-key "g" run-shell "cmd=\$(~/.dotfiles/bin/launcher); [ -n \"\$cmd\" ] && tmux send-keys -t '#{pane_id}' -l \"\$cmd\" && tmux send-keys -t '#{pane_id}' Enter || true"

# clear screen with prefix + ctrl + l
bind C-l send-keys 'C-l'

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# tpm is installed into ~/.config/tmux/plugins/tpm by install.sh

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Configure the catppuccin plugin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
set -g @catppuccin_window_default_text '#W'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'
set -ogq @catppuccin_window_text "#{window_name}"

# Load catppuccin
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

set -g allow-rename off
set -g status-position bottom
set -g status-interval 5
set -g status-right-length 100
set -g status-left-length 100


set -g status-left '#{E:@catppuccin_status_session} '
set -gF  status-right "#{@catppuccin_status_directory}"

# start index at 1
set -g base-index 1
set -g pane-base-index 1

# renumber when window is closed
set -g renumber-window on
setw -g aggressive-resize off

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
