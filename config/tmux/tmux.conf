set -g history-limit 100000
set -g allow-passthrough on
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",*:hyperlinks"

unbind %
bind '\' split-window -h

unbind '"'
bind '-' split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ==============================================================================
# PANE NAVIGATION: <prefix> + hjkl
# ==============================================================================
# Core check: Is the current process running vim or nvim?
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

# Native conditional bindings (Assumes default Ctrl+b prefix)
bind h if-shell "$is_vim" "send-keys C-b h" "select-pane -L"
bind j if-shell "$is_vim" "send-keys C-b j" "select-pane -D"
bind k if-shell "$is_vim" "send-keys C-b k" "select-pane -U"
bind l if-shell "$is_vim" "send-keys C-b l" "select-pane -R"


# PANE RESIZE: <prefix> + Ctrl + hjkl
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

bind -r m resize-pane -Z

# sesh: fzf-driven session/project picker (prefix+s)
bind-key "t" run-shell "sesh connect \"$(sesh list -t | fzf-tmux -p 55%,60% --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ')\""

bind g display-popup -w 80% -h 80% -E -b rounded

set -g mouse on

set-window-option -g mode-keys vi

# Make the background highlight color pop cleanly when selecting text blocks
set-window-option -g mode-style "bg=#{E:@thm_surface_1},fg=#{E:@thm_blue},bold"

bind-key -T copy-mode-vi 'v' send -X begin-selection
# Allows rectangle/block text selection
bind-key -T copy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle

# tpm is installed into ~/.config/tmux/plugins/tpm by install.sh

# List of plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'Morantron/tmux-fingers'

# ==============================================================================
# Configure the catppuccin plugin
# ==============================================================================
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
set -g @catppuccin_window_default_text '#W'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'
set -ogq @catppuccin_window_text "#{window_name}"

# Load catppuccin
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

set -g allow-rename off
set -g status-position bottom
set -g status-interval 5
set -g status-right-length 100
set -g status-left-length 100

set -g @catppuccin_date_time_text ' %H:%M │ %d-%b '

set -g status-left '#{E:@catppuccin_status_session} '
set -gF  status-right "#{@catppuccin_status_directory}"
set -g status-right '#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}'

# start index at 1
set -g base-index 1
set -g pane-base-index 1

# renumber when window is closed
set -g renumber-window on
setw -g aggressive-resize off

# Smooth Undercurls
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setqc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%16777216%/%d::%p1%{256}%&%d%m'

# ==============================================================================
# Configure tmux-fingers
# ==============================================================================
set -g @fingers-key f
set -g @fingers-alt-action "${HOME}/.dotfiles/bin/fingres-router.sh"

set -g @fingers-pattern-0 '(HDFS|HINFRA|DEPENDREQ|UPA|URP|PLANPLAT|DLM|CLOUDMIG|SSD40M|TSTPGM|YARNRED|HDFSRED|SO|IAM)-(\d+)'
set -g @finters-pattern-1 '(\d{9})'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
