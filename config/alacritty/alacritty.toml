[colors.bright]
black = "#353539"
blue = "#b9aeda"
cyan = "#f591b2"
green = "#9dc6ac"
magenta = "#ecaad6"
red = "#ffae9f"
white = "#cac9dd"
yellow = "#f0c5a9"

[colors.cursor]
cursor = "#757581"
text = "#c9c7cd"

[colors.normal]
black = "#27272a"
blue = "#aca1cf"
cyan = "#ea83a5"
green = "#90b99f"
magenta = "#e29eca"
red = "#f5a191"
white = "#c1c0d4"
yellow = "#e6b99d"

[colors.primary]
background = "#161617"
foreground = "#c9c7cd"

[env]
TERM = "xterm-256color"

[cursor]
blink_interval = 500
unfocused_hollow= true
thickness = 0.25 
vi_mode_style = "Block"

[cursor.style]
shape = "Underline"
blinking = "On"

[mouse]
hide_when_typing = false

[selection]
save_to_clipboard = true

[font]
size = 12.0
offset = { x = 0, y = 1 }
glyph_offset = { x = 0, y = 0 }

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[window]
decorations = "buttonless"
dynamic_padding = true
opacity = 0.80
blur = true
option_as_alt = "Both"
startup_mode = "Windowed"

[window.padding]
x = 12
y = 12

[[hints.enabled]]
hyperlinks = true
post_processing = true
mouse = { enabled = true, mods = "None" }
command = "open" # Use "xdg-open" on Linux
regex = "(https?://|git@|git://|ssh://|ftp://|mailto:|file://|www\\.)[A-Za-z0-9._%+-/]+(?::\\d+)?(?:/[^\\s<>'\"]*)?"
binding = { key = "L", mods = "Shift|Control" }

[[hints.enabled]]
hyperlinks = false
post_processing = true
mouse = { enabled = true, mods = "None" }
command = { program = "bash", args = ["-c", "~/.dotfiles/bin/router \"$1\"", "--"] }
regex = "((HDFS|HINFRA|DEPENDREQ|UPA|URP|PLANPLAT|DLM|CLOUDMIG|SSD40M|TSTPGM|YARNRED|HDFSRED|SO|IAM)-(\\d+))|(\\d{9})"
binding = { key = "O", mods = "Shift|Control" }
